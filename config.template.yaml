# ==============================================================================
# 🚀 Clash Dual Fusion: 双订阅合体智能分流配置
# 📌 方案特点：
#    1. 🤖 纯净好节点 (专供 AI：Claude / OpenAI / Gemini / 反重力 / Cursor / OpenRouter)
#    2. 🌐 一般/劣质节点 (日常 4K 视频 / 网页浏览 / GitHub / 下载 / 社媒冲浪)
#    3. 🎮 国内全直连 (Steam / WeGame / 国服手游端游 / B 站全站 / 政务系统 / 银行)
# ==============================================================================

mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: false
unified-delay: true
keep-alive-interval: 15
tcp-concurrent: true

# 虚拟网卡 TUN 模式 (接管系统全部流量，不漏网)
tun:
  enable: true
  stack: gvisor
  auto-route: true
  strict-route: false
  auto-detect-interface: true
  dns-hijack:
    - any:53

# 高性能 DNS 防污染与 Fake-IP 解析
dns:
  enable: true
  listen: 127.0.0.1:5334
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: true
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - 119.29.29.29

# ==================== 双订阅配置集合 (请在下方替换你的两个订阅链接) ====================
proxy-providers:
  # 订阅 1：【纯净好节点】(贵重/专线/家宽/住宅，只给 AI 用)
  premium_ai_provider:
    type: http
    url: "__PREMIUM_AI_SUBSCRIPTION_URL__"
    interval: 86400
    path: ./providers/premium_ai.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  # 订阅 2：【一般/劣质节点】(大流量/低成本，负责日常耗流量冲浪与视频)
  general_provider:
    type: http
    url: "__GENERAL_SUBSCRIPTION_URL__"
    interval: 86400
    path: ./providers/cheap_waterpipe.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# ==================== 策略分组 ====================
proxy-groups:
  # 1. 【AI 专供组】(锁定订阅 1 的纯净节点，默认排除易封锁地区)
  - name: "🤖 纯净AI专用(优质节点)"
    type: select
    proxies:
      - "⚡ 纯净AI自动测速"
    use:
      - premium_ai_provider
    filter: "(?i)美国|日本|新加坡|US|JP|SG|United States|Japan|Singapore"

  # 1.1 AI 专供测速组 (自动挑选延时最低的 AI 节点)
  - name: "⚡ 纯净AI自动测速"
    type: url-test
    use:
      - premium_ai_provider
    filter: "(?i)美国|日本|新加坡|US|JP|SG|United States|Japan|Singapore"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 2. 【一般节点日常冲浪组】(走订阅 2，自动排除 Claude 403 封锁的香港地区)
  - name: "🌐 日常浏览(一般节点)"
    type: select
    proxies:
      - "⚡ 一般节点自动测速"
      - "DIRECT"
    use:
      - general_provider
    filter: "(?i)日本|新加坡|美国|JP|SG|US"

  # 2.1 一般/劣质节点测速组 (自动优选最快最稳的线路)
  - name: "⚡ 一般节点自动测速"
    type: url-test
    use:
      - general_provider
    filter: "(?i)日本|新加坡|美国|JP|SG|US"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 3. 【全球合体大分组】(两个订阅全部节点汇聚，手动备用)
  - name: "🚀 全球互联(双订阅合体)"
    type: select
    use:
      - premium_ai_provider
      - general_provider
    proxies:
      - "DIRECT"

  # 4. 【独立订阅查看】订阅 1 全节点
  - name: "🏷️ 纯净AI订阅全部节点"
    type: select
    use:
      - premium_ai_provider

  # 5. 【独立订阅查看】订阅 2 全节点
  - name: "⚡ 一般/劣质节点全部节点"
    type: select
    use:
      - general_provider

